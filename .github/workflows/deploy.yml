name: Deploy

# Ships main to production once CI has passed on it. Each job is skipped, not
# failed, when its credentials are absent, so the workflow can be adopted one
# secret at a time:
#
#   CONVEX_DEPLOY_KEY      Convex dashboard → Settings → Deploy keys (production)
#   CLOUDFLARE_API_TOKEN   Cloudflare → API tokens, "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → Account ID
#
# The backend goes first, then saved audio delivery, then the reader.
# Marketing can deploy after the backend. Every checkout uses the tested
# commit because workflow_run's default SHA can differ from CI's head_sha.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Deploy Convex functions
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy --yes
      - name: Skipped (no CONVEX_DEPLOY_KEY)
        if: ${{ env.CONVEX_DEPLOY_KEY == '' }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: echo "CONVEX_DEPLOY_KEY is not set; skipping the Convex deploy."

  audio-packager:
    needs: backend
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Deploy saved audio delivery
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: apps/audio-packager
        run: bun run deploy
      - name: Skipped (no CLOUDFLARE_API_TOKEN)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping saved audio delivery."

  web:
    needs: [backend, audio-packager]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build the reader
        working-directory: apps/web
        run: bun run build
      - name: Deploy the reader Worker (app.kinreader.com)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: apps/web
        run: bunx wrangler deploy
      - name: Skipped (no CLOUDFLARE_API_TOKEN)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping the reader deploy."

  marketing:
    needs: backend
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build the marketing site
        working-directory: apps/marketing
        run: bun run build
      - name: Deploy the marketing Worker (kinreader.com)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: apps/marketing
        run: bunx wrangler deploy
      - name: Skipped (no CLOUDFLARE_API_TOKEN)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping the marketing deploy."
